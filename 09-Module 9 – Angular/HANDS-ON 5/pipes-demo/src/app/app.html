<h2>Angular Pipes Demo</h2>

<p><strong>Original Name:</strong> {{ studentName }}</p>
<p><strong>Uppercase Pipe:</strong> {{ studentName | uppercase }}</p>
<p><strong>Lowercase Pipe:</strong> {{ studentName | lowercase }}</p>
<p><strong>Date Pipe:</strong> {{ currentDate | date:'fullDate' }}</p>
<p><strong>Currency Pipe:</strong> {{ marks | currency:'INR' }}</p>
<p><strong>Number Pipe:</strong> {{ marks | number:'1.2-2' }}</p>
