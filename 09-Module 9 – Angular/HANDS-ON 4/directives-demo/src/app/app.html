<h2>Student List</h2>

<ul>
  <li *ngFor="let student of students">{{ student }}</li>
</ul>

<p *ngIf="students.length > 0">Total Students: {{ students.length }}</p>

<p [ngStyle]="{'color': 'blue', 'font-weight': 'bold'}">
  Welcome to Angular Directives!
</p>

<p [ngClass]="{'highlight': isHighlighted}">
  This text changes style dynamically.
</p>

<button (click)="toggleHighlight()">Toggle Highlight</button>
<p appHighlight>Hover over me to see the directive effect!</p>
